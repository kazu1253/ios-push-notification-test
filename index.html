<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Push Test</title>
</head>
<body>
  <h1>iOS Push Test</h1>
  <button id="btn">通知を許可してトークンを取得</button>
  <p id="status"></p>
  <textarea id="token" style="width:100%; height:200px;"></textarea>

  <script>
    const VAPID_PUBLIC_KEY = 'BGGKz0_0WhWhwIXo1lD9B_luFWk5N6f-riiFxZVubsUtWQyDSUrcYU0j6WCwNFARqLjSqpI-XkwHdNQwSH6hFQQ'; // 後述のツールで生成したものに書き換え

    async function register() {
      const sw = await navigator.serviceWorker.register('sw.js');
      const permission = await Notification.requestPermission();
      
      if (permission === 'granted') {
        const sub = await sw.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: VAPID_PUBLIC_KEY
        });
        // このJSONをコピーしてテストに使います
        document.getElementById('token').value = JSON.stringify(sub);
        document.getElementById('status').innerText = 'トークン取得完了！';
      }
    }
    document.getElementById('btn').onclick = register;
  </script>
</body>
</html>
